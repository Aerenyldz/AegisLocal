services:
  api:
    restart: unless-stopped
    build:
      context: ../../backend
      dockerfile: ../infra/docker/Dockerfile.api
    ports:
      - "${AEGIS_API_BIND:-127.0.0.1}:${AEGIS_API_PORT:-8000}:8000"
    environment:
      AEGIS_REDIS_ENABLED: "true"
      AEGIS_REDIS_URL: redis://:${REDIS_PASSWORD:?REDIS_PASSWORD must be set}@redis:6379/0
      AEGIS_AUDIT_DB_PATH: /data/audit.sqlite3
      AEGIS_CHALLENGE_TOKEN_SECRET: ${AEGIS_CHALLENGE_TOKEN_SECRET:?AEGIS_CHALLENGE_TOKEN_SECRET must be set}
      AEGIS_ONNX_MODEL_PATH: ${AEGIS_ONNX_MODEL_PATH:-}
      AEGIS_ONNX_MODEL_VERSION: ${AEGIS_ONNX_MODEL_VERSION:-onnx-unconfigured}
      AEGIS_ONNX_SHADOW_ENABLED: ${AEGIS_ONNX_SHADOW_ENABLED:-true}
      AEGIS_DEBUG: "false"
      AEGIS_API_KEY_REQUIRED: ${AEGIS_API_KEY_REQUIRED:-true}
      AEGIS_API_KEY: ${AEGIS_API_KEY:?AEGIS_API_KEY must be set}
      AEGIS_TRUST_PROXY_HEADERS: ${AEGIS_TRUST_PROXY_HEADERS:-false}
      AEGIS_TRUSTED_PROXY_IPS: ${AEGIS_TRUSTED_PROXY_IPS:-}
    depends_on:
      redis:
        condition: service_healthy
    volumes:
      - aegis_data:/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 10s
      timeout: 3s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD:?REDIS_PASSWORD must be set}"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "--no-auth-warning", "-a", "${REDIS_PASSWORD:?REDIS_PASSWORD must be set}", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  prometheus:
    image: prom/prometheus:v2.54.1
    volumes:
      - ../prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"
    profiles: ["ops"]

  grafana:
    image: grafana/grafana:11.2.0
    ports:
      - "3000:3000"
    profiles: ["ops"]

volumes:
  aegis_data:
  redis_data:
