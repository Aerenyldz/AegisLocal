[package]
name = "aegis-pow"
version = "0.1.0"
edition = "2021"
description = "AegisLocal browser Proof-of-Work (SHA-256 leading-zero bits)"
license = "UNLICENSED"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
sha2 = "0.10"
hex = "0.4"
wasm-bindgen = "0.2"

[profile.release]
opt-level = 3
lto = true
